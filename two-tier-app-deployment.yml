kind: Deployment
apiVersion: apps/v1
metadata:
  name: two-tier-app
  labels:
    app: two-tier-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: two-tier-app
  template:
    metadata:
      labels:
        app: two-tier-app
    spec:
      containers:
        - name: two-tier-app-ctr
          image: rohankalamakar/project-2tier-flask-app:latest
          env:
            - name: MYSQL_HOST
              value: "10.100.96.255"
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_PASSWORD
              value: "admin"
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_DB
              value: "mydb"
          ports:
            - containerPort: 5000
          imagePullPolicy: Always
