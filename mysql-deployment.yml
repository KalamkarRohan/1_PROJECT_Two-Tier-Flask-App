kind: Deployment
apiVersion: apps/v1
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql-ctr
          image: mysql:latest
          env:
            - name: MYSQL_USER
              value: "admin"
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_PASSWORD
              value: "admin"
            - name: MYSQL_DATABASE
              value: "mydb"
          ports:
            - containerPort: 3306



